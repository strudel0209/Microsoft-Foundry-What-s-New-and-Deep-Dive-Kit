/* ---------- trace ---------- */
.span-l{position:absolute;width:270px;font-size:14px;color:var(--muted)}
.span-l code{display:block;font-family:var(--mono);font-size:15px;color:var(--ink)}
.mon{padding:20px 22px}
.mon .it{display:flex;flex-direction:column;padding:9px 0;border-top:1px solid var(--line)}
.mon .it b{font-size:16px}.mon .it span{font-size:14px;color:var(--muted)}

/* ---------- compare ---------- */
.cmp-h{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 16px;text-align:start}
.cmp-h b{font-size:18px}
.cmp-h .chip{align-self:flex-start}
.cmp-q{display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:600}
.cmp-c{display:flex;align-items:center;padding:0 16px;font-size:15px;line-height:1.35;color:var(--muted);background:rgba(24,36,78,.45);border:1px solid var(--line);transition:opacity .3s,background .3s,border-color .3s,transform .6s cubic-bezier(.2,.7,.2,1) var(--d,0s)}

.chev{position:absolute;height:84px;display:flex;align-items:center;gap:14px;padding:0 34px 0 40px;font-size:20px;font-weight:700;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,9% 50%)}

.chev .pn{font-size:28px;font-weight:800;opacity:.9}
.pbul{padding:16px 18px}
.pbul div{font-size:15px;line-height:1.4;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
.pbul div:first-child{border-top:0}
.prove{padding:20px 24px}
.prove .h-sm{margin-bottom:14px}
.pv{display:flex;align-items:center;gap:14px;font-size:17px;padding:10px 0}

.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:999px;color:#1B1300;background:var(--steady)}
.filters{position:absolute;right:70px;top:136px;display:flex;gap:8px}
.refcol{padding:18px 20px}
.refcol h3{margin:0 0 6px;font-size:18px}

#drawer{position:fixed;top:54px;bottom:58px;right:0;width:min(440px,92vw);z-index:30;background:rgba(9,15,36,.97);border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);padding:24px 26px;overflow:auto}

#notes{position:fixed;left:0;right:0;bottom:58px;z-index:15;max-height:38vh;overflow:auto;background:rgba(9,15,36,.97);border-top:1px solid var(--line2);padding:18px 28px 22px;transform:translateY(calc(100% + 64px));transition:transform .35s cubic-bezier(.2,.7,.2,1)}
#notes.open{transform:none}
#notes h2{margin:0 0 8px;font-size:12px;letter-spacing:.16em;color:var(--teal);text-transform:uppercase}
#notes p{margin:0;font-size:16px;line-height:1.65;color:var(--muted);max-width:1200px}
#notes p b{color:var(--ink)}
#rail{position:fixed;top:54px;bottom:58px;left:0;width:min(360px,90vw);z-index:30;background:rgba(9,15,36,.97);border-right:1px solid var(--line2);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);overflow:auto;padding:16px 0}
#rail.open{transform:none}
#rail h3{margin:16px 22px 6px;font-size:12px;letter-spacing:.16em;color:var(--teal);text-transform:uppercase}
#rail button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--muted);text-align:start;padding:8px 22px;font-size:14.5px;cursor:pointer}
#rail button:hover{background:rgba(0,179,159,.1);color:#fff}

#rail .dots{display:flex;gap:3px}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:rgba(9,15,36,.95);border:1px solid var(--teal);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}

ch need, and how is each one licensed. The most useful answer starts with a correction of the question itself. These products are not five alternatives. They sit in different layers: some are where people use AI, some are where agents are built, Microsoft IQ supplies the context agents reason over, and a governance layer covers all of them. Options inside the same layer can be compared. Products in different layers are combined. The deck follows that logic: first the layers, then the real comparisons, then how the pieces connect and how each is charged. Microsoft IQ, announced at Ignite in November 2026, groups Work IQ, Fabric IQ, Foundry IQ and Web IQ into one context layer. In-product Copilots is a grouping used in this deck, not a Microsoft offering. Every fact was checked against official pages on 20 November 2026; prices are left off on purpose. Likely question: is this a licensing review? No. It frames the choice; the account team confirms terms."},{"id":"layers","type":"layers","section":"s1","slide":2,"short":"Compare or combine","kicker":"01 · COMPARE OR COMBINE","title":"Compare or combine","subtitle":"Options in the same layer do the same job and can be compared; the layers are designed to work together","tags":["use","build","ground","run"],"preview":true,"sources":[{"label":"Microsoft 365 Copilot overview","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-overview"},{"label":"Choose between Agent Builder and Copilot Studio","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/copilot-studio-experience"},{"label":"Microsoft IQ documentation","url":"https://learn.microsoft.com/en-us/microsoft-iq/"},{"label":"Fabric data agent data sources","url":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-add-datasources"},{"label":"Agent 365 licensing FAQ","url":"https://www.microsoft.com/licensing/faqs/122"}],"hint":"Select a block to see what it connects to; the tags on the right say what can be compared","relLabel":"It connects directly to the highlighted blocks, listed below; governance applies to all of them.","govLine":"It applies to every layer: Use, Build, Ground and Data.","notes":"Read the map row by row. The top row is where people use AI: Microsoft 365 Copilot across the Microsoft 365 apps, and the Copilots built into individual products. The build row holds the four ways to create a custom agent. The ground row is Microsoft IQ, the context layer Microsoft announced at Ignite in November 2026. It brings together four complementary IQs: Work IQ for how people work, Fabric IQ for the state of the business, Foundry IQ for curated knowledge such as policies and documents, and Web IQ for fresh public web context. The data row shows where that information already lives; each IQ reads from its own sources. Fabric therefore appears as the data platform, through Fabric IQ, and through its data agent. Ontologies are still in preview, while the Fabric IQ workload itself is generally available. The bottom row governs everything. Options in the top two rows can be compared; the lower rows are combined with whatever is chosen above them. Likely question: does a solution need all four IQs? No. Most agents start with one or two and add others as needs grow.","rows":[{"k":"use","name":"Use","who":"Every employee, in the apps they already use","tag":["Compare","by where the work happens"],"blocks":[{"id":"m365","t":"Microsoft 365 Copilot","d":"AI assistant in Word, Excel, PowerPoint, Outlook and Teams, grounded in the user's work","detail":"The AI assistant across the Microsoft 365 apps. Work IQ grounding is built in, so answers draw on the documents, mail, meetings and chats the signed-in user can already access. Agent Builder agents, Copilot Studio agents, Foundry agents and Fabric data agents* can all be published into it.","src":[{"label":"Microsoft 365 Copilot overview","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-overview"},{"label":"Declarative and custom engine agents","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agents-overview"}],"rel":["agb","cs","fdy","fda","workiq"],"go":"options"},{"id":"inprod","t":"In-product Copilots","d":"Not one offering: the Copilot inside Dynamics 365, Fabric and Power BI, GitHub, Security or Azure","detail":"A grouping used on this page, not a Microsoft offering: each product has its own Copilot, licence and admin settings, and helps inside that product's own screens. Examples are Copilot in Dynamics 365, Copilot in Fabric and Power BI, GitHub Copilot, Microsoft Security Copilot and Azure Copilot.","src":[{"label":"Azure Copilot overview","url":"https://learn.microsoft.com/en-us/azure/copilot/overview"},{"label":"Dynamics 365 Sales pricing","url":"https://www.microsoft.com/en-us/dynamics-365/products/sales/pricing"}],"rel":["dfab"],"go":"options"}]},{"k":"build","name":"Build","who":"Business users, makers, developers and data teams","tag":["Compare","by builder and control"],"blocks":[{"id":"agb","t":"Agent Builder","d":"Simple agents in Microsoft 365 Copilot, configured in plain language","detail":"Part of Microsoft 365 Copilot. Business users describe an agent in plain language over approved content such as files and sites. An Agent Builder agent can later be copied to Copilot Studio when it needs more.","src":[{"label":"Choose between Agent Builder and Copilot Studio","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/copilot-studio-experience"}],"rel":["m365","cs","workiq"],"go":"options"},{"id":"cs","t":"Copilot Studio","d":"Low-code agents and agent flows with connectors","detail":"Makers build agents with tools, connectors, agent flows with approvals and external channels, within IT guardrails. Work IQ and Fabric data agents can be added as tools, and a Foundry agent can be added as a connected agent*.","src":[{"label":"Harnesses in Copilot Studio","url":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/harnesses-overview"},{"label":"Fabric data agent as a tool in Copilot Studio","url":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-microsoft-copilot-studio-tool"},{"label":"Add a Foundry agent as a connected agent","url":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/add-agent-foundry"}],"rel":["m365","workiq","fda","fdy"],"go":"options"},{"id":"fdy","t":"Microsoft Foundry","d":"Pro-code agents with model choice and evaluation","detail":"Developers choose models and orchestration, evaluate and trace agents, and publish them to applications, Microsoft 365 and other agents. A Foundry agent can use all four IQs: Foundry IQ knowledge bases, the Fabric IQ tool*, Work IQ and Web IQ.","src":[{"label":"Billing concepts for Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/billing-concepts"},{"label":"Connect Foundry agents to Fabric IQ","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/fabric-iq"},{"label":"Connect Foundry agents to Work IQ","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/work-iq"},{"label":"Web grounding tools in Foundry (Web IQ)","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-overview"}],"rel":["workiq","fabiq","foundryiq","webiq","m365","cs"],"go":"options"},{"id":"fda","t":"Fabric data agent","d":"Plain-language questions over governed Fabric data","detail":"Built in Fabric by the people who own the data. It turns each question into a SQL, DAX or KQL query, respects row-level and column-level security, and can be published to Microsoft 365 Copilot* or used as a tool by Copilot Studio and Foundry agents.","src":[{"label":"Fabric data agent data sources","url":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-add-datasources"},{"label":"Fabric data agent in Microsoft 365 Copilot","url":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-microsoft-365-c ales/pricing"},{"label":"Security Copilot pricing","url":"https://www.microsoft.com/en-us/security/pricing/microsoft-security-copilot"}],"go":"options","focus":1}},{"id":"m365","t":"Everyday work in documents, mail, meetings and chats","d":"Word, Excel, PowerPoint, Outlook and Teams","res":{"t":"Microsoft 365 Copilot","why":"The AI assistant across the Microsoft 365 apps, grounded in the work the signed-in user can already access.","rows":[["Context","Work IQ grounding built in: documents, mail, meetings and chats the user can access"],["Reaches people in","Word, Excel, PowerPoint, Outlook and Teams"],["Governed in","Microsoft 365 admin center, with Microsoft Purview labels, data loss prevention and audit"],["Charged by","Per user: add-on licence, or included in Microsoft 365 E7"],["When it grows","Agent Builder agents for focused tasks over approved content"]],"src":[{"label":"Microsoft 365 Copilot overview","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-overview"},{"label":"License options for Microsoft Copilot","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-license-options"}],"go":"options","focus":0}},{"id":"agb","t":"A focused helper over approved content","d":"Instructions, files and sites for one task or team","res":{"t":"Agent Builder agent","why":"Part of Microsoft 365 Copilot: a business user describes the agent in plain language over approved content.","rows":[["Build with","Agent Builder in Microsoft 365 Copilot: instructions, files and sites"],["Limits","Does not author actions against external services"],["Reaches people in","Microsoft 365 Copilot, shared with a team"],["Charged by","Part of Microsoft 365 Copilot; use in Copilot Chat by people without that licence draws Copilot Credits"],["When it grows","Copy the agent to Copilot Studio to add actions, workflows and channels"]],"src":[{"label":"Choose between Agent Builder and Copilot Studio","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot     } else oldEl.classList.add("leave");
    teardown(oldG);
    setTimeout(function () { oldEl.remove(); }, RM ? 0 : 560);
  }
  if (SC[cur] && SC[cur].type === "map" && i !== cur) cameFrom = "map";
  else if (SC[i].type === "map") cameFrom = null;
  cur = i;
  var g = build(i);
  g.root.classList.add(opt.from && SC[i].type !== "map" ? "rise" : "enter");
  stage.appendChild(g.root);
  beat = opt.full ? (SC[i].beats || 0) : 0;
  if (opt.focus !== undefined && opt.focus !== null) beat = SC[i].beats || 0;
  applyBeat(true);
  requestAnimationFrame(function () { requestAnimationFrame(function () { g.root.classList.remove("enter", "rise"); }); });
  if (opt.focus !== undefined && opt.focus !== null && g.focus) g.focus(opt.focus);
  if (location.hash.slice(1) !== SC[i].id) {
    try { history.replaceState(null, "", "#" + SC[i].id); }
    catch (e) { /* Sandboxed previews may have an opaque origin; scene navigation still works without updating the hash. */ }
  }
  setNotes(); updateRail(); updateCrumb();
  document.getElementById("walkBtn").classList.toggle("hidden", SC[i].type !== "tree");
}
function next() {
  var s = SC[cur];
  if (beat < (s.beats || 0)) { beat++; applyBeat(); return true; }
  if (cur < SC.length - 1) { go(cur + 1); return true; }
  return false;
}
function prev() {
  if (beat > 0) { beat--; applyBeat(); return; }
  if (cur > 0) go(cur - 1, {full: true});
}

/* ------------------------------------------------------------------ chrome: progress, rail, crumb */
var progress = document.getElementById("progress"), beatsEl = document.getElementById("beats"), counter = document.getElementById("counter");
SC.forEach(function (s, i) {
  add(progress, el("button", {class: s.type === "map" ? "hub" : "", title: s.short, "aria-label": s.short, onclick: function () { go(i); }}));
});
function updateBars() {
  progress.querySelectorAll("button").forEach(function (b, i) { b.classList.toggle("cur", i === cur); b.classList.toggle("done", i < cur); });
  beatsEl.innerHTML = "";
  for (var k = 0; k <= (SC[cur].beats || 0); k++) add(beatsEl, el("i", {class: k <= beat ? "on" : ""}));
  counter.textContent = (cur + 1) + " / " + SC.length;
}
function buildRail() {
  var body = railEl.querySelector(".body"); body.innerHTML = "";
  STORY.sections.forEach(function (sec) {
    add(body, el("h3", {text: (sec.num === "00" ? "" : sec.num + " · ") + sec.name}));
    SC.forEach(function (s, i) {
      if (s.section !== sec.id) return;
      var dots = el("span", {class: "dots"}, (s.tags || []).map(function (t) { return el("i", {style: "background:" + COLORS[t]}); }));
      add(body, el("button", {"data-i": i, onclick: function () { go(i); toggle(railEl, document.getElementById("railBtn"), false); }}, el("span", {text: s.short}), dots, el("small", {text: slideLabel(s, "")})));
    });
  });
}
function updateRail() { railEl.querySelectorAll("button[data-i]").forEach(function (b) { b.classList.toggle("cur", +b.getAttribute("data-i") === cur); }); }
function updateCrumb() {
  var c = document.getElementById("crumb"); c.innerHTML = "";
  var s = SC[cur], sec = STORY.sections.filter(function (x) { return x.id === s.section; })[0];
  if (s.type !== "map" && s.type !== "title") {
    if (HUB) add(c, el("button", {text: LBL("hub", "Main decision tree"), onclick: function () { go(HUB, {full: true}); }}), "  ›  ");
  }
  add(c, el("span", {text: (sec && sec.num !== "00" ? sec.num + " " + sec.name + "  ›  " : "")}), el("b", {text: s.short}));
}

/* ------------------------------------------------------------------ fit, background, events */
function fit() {
  var r = viewport.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H);
  var x = (r.width - W * k) / 2, y = (r.height - H * k) / 2;
  stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")";
}
window.addEventListener("resize", fit);

(function bg() {
  var cv = document.getElementById("bg"), ctx = cv.getContext("2d"), pts = [], DPR = Math.min(2, window.devicePixelRatio || 1);
  function size() { cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
  size(); window.addEventListener("resize", size);
  for (var i = 0; i < 70; i++) pts.push({x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .00012, vy: (Math.random() - .5) * .00012});
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var Wd = cv.width, Hd = cv.height;
    pts.forEach(function (p) { if (!RM) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > 1) p.vx *= -1; if (p.y < 0 || p.y > 1) p.vy *= -1; } });
    for (var a = 0; a < pts.length; a++) for (var b = a + 1; b < pts.length; b++) {
      var dx = (pts[a].x - pts[b].x) * Wd, dy = (pts[a].y - pts[b].y) * Hd, d = Math.sqrt(dx * dx + dy * dy), lim = 170 * DPR;
      if (d < lim) { ctx.strokeStyle = "rgba(0,179,159," + (0.09 * (1 - d / lim)).toFixed(3) + ")"; ctx.lineWidth = DPR; ctx.beginPath(); ctx.moveTo(pts[a].x * Wd, pts[a].y * Hd); ctx.lineTo(pts[b].x * Wd, pts[b].y * Hd); ctx.stroke(); }
    }
    pts.forEach(function (p) { ctx.fillStyle = "rgba(44,229,203,.35)"; ctx.beginPath(); ctx.arc(p.x * Wd, p.y * Hd, 1.6 * DPR, 0, 6.3); ctx.fill(); });
    if (!RM) requestAnimationFrame(draw);
  }
  draw();
})();

document.getElementById("nextBtn").addEventListener("click", function () { next(); });
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("railBtn").addEventListener("click", function (e) { toggle(railEl, e.currentTarget); });
document.getElementById("notesBtn").addEventListener("click", function (e) { toggle(notesEl, e.currentTarget); });
document.getElementById("mapBtn").addEventListener("click", function () { if (HUB) go(HUB, {full: true}); });
if (!HUB) document.getElementById("mapBtn").classList.add("hidden");
document.getElementById("walkBtn").addEventListener("click", function () { if (G && G.walk) G.walk(); });
document.getElementById("fsBtn").addEventListener("click", fullscreen);
document.getElementById("playBtn").addEventListener("click", function (e) { setAuto(!autoplay); });
var uiT, viewOnly = false;
/* Full screen: standard API, webkit-prefixed fallback (older Safari), and a toolbar-free view when the
   browser or the hosting page blocks the API (an embedded preview, a sandboxed frame or a browser policy). */
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function pres() {
  var on = !!fsEl() || viewOnly;
  document.body.classList.toggle("pres", on); fit();
  document.getElementById("fsBtn").setAttribute("aria-pressed", on ? "true" : "false");
  if (on) { poke(); }
}
function poke() { document.body.classList.add("ui"); clearTimeout(uiT); uiT = setTimeout(function () { document.body.classList.remove("ui"); }, 2600); }
function setViewOnly(on) { viewOnly = on; if (!on) { clearTimeout(toastT); document.getElementById("toast").classList.remove("on"); } pres(); }
function fsBlocked() {
  if (fsEl() || viewOnly) return;
  setViewOnly(true);
  toast("Full screen is blocked in this view, so the toolbars are hidden instead. F11 gives browser full screen; F or Esc restores the toolbars.", 6000);
}
document.addEventListener("fullscreenchange", pres);
document.addEventListener("webkitfullscreenchange", pres);
document.addEventListener("fullscreenerror", fsBlocked);
document.addEventListener("webkitfullscreenerror", fsBlocked);
document.addEventListener("mousemove", function () { if (document.body.classList.contains("pres")) poke(); });
function fullscreen() {
  if (fsEl()) { var x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); return; }
  if (viewOnly) { setViewOnly(false); return; }
  var d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
  var enabled = document.fullscreenEnabled !== undefined ? document.fullscreenEnabled : document.webkitFullscreenEnabled;
  if (!req || enabled === false) { fsBlocked(); return; }
  try { var r = req.call(d); if (r && typeof r.then === "function") r.then(null, fsBlocked); }
  catch (e) { fsBlocked(); }
}
function setAuto(on) {
  var b = document.getElementById("playBtn");
  if (autoplay) { clearInterval(autoplay); autoplay = null; }
  if (on) { autoplay = setInterval(function () { if (!next()) setAuto(false); }, 4500); toast("Autoplay on"); }
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.querySelector("span").textContent = on ? "Pause" : "Play";
}
document.addEventListener("keydown", function (e) {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || (k === " " && !(e.target && e.target.closest && e.target.closest("button,[role=button]")))) { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); prev(); }
  else if (k === "Home") go(0);
  else if (k === "End") go(SC.length - 1, {full: true});
  else if (k === "Escape") { if (viewOnly) setViewOnly(false); closeDrawer(); toggle(railEl, document.getElementById("railBtn"), false); toggle(notesEl, document.getElementById("notesBtn"), false); }
  else if (k === "n" || k === "N") toggle(notesEl, document.getElementById("notesBtn"));
  else if (k === "c" || k === "C") toggle(railEl, document.getElementById("railBtn"));
  else if ((k === "m" || k === "M") && HUB) go(HUB, {full: true});
  else if (k === "f" || k === "F") fullscreen();
  else if (k === "p" || k === "P") setAuto(!autoplay);
  else if ((k === "w" || k === "W") && G && G.walk) G.walk();
});
window.addEventListener("hashchange", function () { var id = location.hash.slice(1); if (IDX[id] !== undefined && IDX[id] !== cur) go(id); });

window.__story = {count: SC.length, go: function (id, full) { go(id, {full: !!full}); }, state: function () { return {i: cur, id: SC[cur].id, beat: beat, beats: SC[cur].beats || 0}; }};
buildRail(); fit();
var start = IDX[location.hash.slice(1)];
go(start !== undefined ? start : 0);
requestAnimationFrame(tick);
})();
