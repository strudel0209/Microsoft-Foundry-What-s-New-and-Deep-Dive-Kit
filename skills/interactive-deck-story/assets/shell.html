<!DOCTYPE html>
<html lang="{{LANG}}" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="generator" content="interactive-deck-story engine {{ENGINE_VERSION}}">
<title>{{TITLE}} · interactive story</title>
<style>
{{CSS}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow-a" aria-hidden="true"></div><div class="glow-b" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
</svg>
<header id="top">
  <div class="brand"><i></i><span>{{BRAND}}</span></div>
  <nav class="crumb" id="crumb" aria-label="Location"></nav>
  <button class="tb" id="mapBtn" type="button">{{HUB_SHORT}} <kbd>M</kbd></button>
  <button class="tb" id="railBtn" type="button" aria-pressed="false" aria-controls="rail">Chapters <kbd>C</kbd></button>
  <button class="tb hidden" id="walkBtn" type="button">Walk <kbd>W</kbd></button>
  <button class="tb" id="notesBtn" type="button" aria-pressed="false" aria-controls="notes">Notes <kbd>N</kbd></button>
  <button class="tb" id="playBtn" type="button" aria-pressed="false"><span>Play</span> <kbd>P</kbd></button>
  <button class="tb" id="fsBtn" type="button" aria-pressed="false">Full screen <kbd>F</kbd></button>
</header>
<main id="viewport"><div id="stage" aria-live="polite"></div></main>
<footer id="bottom">
  <button class="tb" id="prevBtn" type="button" aria-label="Previous step">‹ Back</button>
  <div id="progress" role="navigation" aria-label="Scenes"></div>
  <div class="beats" id="beats" aria-hidden="true"></div>
  <div class="counter" id="counter"></div>
  <button class="tb primary" id="nextBtn" type="button" aria-label="Next step">Next ›</button>
</footer>
<nav id="rail" aria-label="Chapters"><div class="body"></div></nav>
<aside id="drawer" aria-hidden="true" aria-label="Details"><button class="x" type="button" aria-label="Close details">✕</button><div class="body"></div></aside>
<section id="notes" aria-label="Presenter notes"><h2>Presenter notes</h2><p></p></section>
<div class="toast" id="toast" role="status"></div>
<script type="application/json" id="story-data">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
