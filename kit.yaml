# kit.yaml — manifest of the Microsoft Foundry What's New and Deep-Dive Kit.
# Read on every run by the three kit skills (azure-ai-deep-dive-deck, foundry-whats-new-deck,
# deck-companion-notebook). The files in the repository win over this manifest: when they
# disagree, fix this file in the same pull request.
# Personal values (private package index, tenant, subscription, resource names) never go here:
# put them in .env (git-ignored) or kit.local.yaml (git-ignored).

kit:
  name: Microsoft Foundry What's New and Deep-Dive Kit
  manifest_version: 1
  skills_version: 1.2.0          # see skills/CHANGELOG.md
  updated: 2026-11-09
  python_kernel: "3.12"          # notebooks (devcontainer)
  hosted_agent_runtime: ["3.13"]   # agent/azure.yaml and private-agent/azure.yaml — separate from the kernel

paths:
  skills: skills/
  decks: decks/
  deck_changelog: decks/CHANGELOG.md            # owned by foundry-whats-new-deck
  deep_dive_register: decks/DEEP-DIVE-DECKS.md  # owned by azure-ai-deep-dive-deck
  notebooks: ./                                 # foundry-demo-<n>-<topic>.ipynb at the root
  notebooks_changelog: NOTEBOOKS-CHANGELOG.md   # owned by deck-companion-notebook
  requirements: requirements.txt
  env_example: .env.example
  readme: README.md
  samples: samples/                             # shared synthetic datasets; generated output is never committed

naming:
  whats_new_deck: "Microsoft-Foundry-Whats-New-<yyyy>-<mm>[-<dd>].pptx"
  deep_dive_deck: "Microsoft Foundry <Subject>.pptx"   # Title Case subject, no "deep dive", no date; edition in decks[].edition
  notebook: "foundry-demo-<n>-<topic>.ipynb"
  rule: >-
    New files use these patterns. A deep-dive deck keeps one file name across editions: a new
    edition replaces the file in a pull request and gets a new register entry (git history is
    the rollback). The what's-new deck gets a new dated file per edition. Never rename or
    renumber another contributor's file.

next_notebook_number: 10

decks:
  - file: Microsoft-Foundry-Whats-New-2026-10-26.pptx
    kind: whats-new
    edition: 2026-10-26
    slides: 27
    maintained_by: foundry-whats-new-deck
    pairs_with: [1]
    previous_edition: Microsoft-Foundry-Whats-New-2026-10.pptx   # edition 2026-10-22 (26 slides); removed from decks/ on 2026-10-30 — the rollback is git history
    note: slide 11 "Decision models" added in 2026-10-26 and slide 12 "Browser automation tool" in 2026-10-22; edition 2026-10 slide 11 is now 12 and slides 12-25 are now 14-27
  - file: "Microsoft Foundry Guardrails - Tuning Without Over-Blocking.pptx"
    kind: deep-dive
    source_build: guardrails-tuning-deep-dive-2026-10 (refactored with azure-ai-deep-dive-deck; replaces the V4 build)
    slides: 14
    pairs_with: [1]
    note: guardrails section of notebook 1; test data from github.com/strudel0209/foundry-content-safety-eval
  - file: "Microsoft Foundry Hosted Agents.pptx"
    kind: deep-dive
    source_build: hosted-agents-deep-dive-2026-10 (second build)
    slides: 7
    pairs_with: [2, 3]
  - file: "Microsoft Foundry Prompt Caching.pptx"
    kind: deep-dive
    pairs_with: [4]
    note: not built with the kit skills
  - file: "Microsoft Foundry Agent2Agent-A2A.pptx"
    kind: deep-dive
    pairs_with: [5]
  - file: "Microsoft Foundry Content-Understanding.pptx"
    kind: deep-dive
    slides: 12
    pairs_with: [6]
  - file: "Microsoft Foundry Voice Live-Voice Agents.pptx"
    kind: deep-dive
    source_build: voice-live-voice-agents-deep-dive-2026-10 (second build)
    slides: 9
    pairs_with: [7]
  - file: "Microsoft Foundry AI Gateway.pptx"
    kind: deep-dive
    source_build: ai-gateway-deep-dive-2026-10 (second build)
    slides: 9
    pairs_with: [8]
  - file: "Microsoft Foundry Copilot Harness Prompt Agents.pptx"
    kind: deep-dive
    edition: 2026-10
    slides: 7
    pairs_with: [9]         # NB9 step 5 compares prompt, harness and hosted agents; no slide mapping
    note: Microsoft Copilot harness for prompt agents (preview); compares standard prompt agents, harness agents and hosted agents
  - file: "Microsoft Foundry Fabric IQ Ontologies for Agents.pptx"
    kind: deep-dive
    edition: 2026-11
    slides: 17
    pairs_with: []          # no companion notebook yet
    note: Fabric IQ ontologies with structured and unstructured data for Foundry, Copilot Studio and Microsoft 365 Copilot agents; customer-neutral kit copy (first built for a customer session); carries the Microsoft sensitivity label from OneDrive, no encryption

notebooks:
  - n: 1
    file: foundry-demo-1-what-is-new.ipynb
    deck: Microsoft-Foundry-Whats-New-2026-10-26.pptx   # slide references still follow edition 2026-10, except step 2b (slide 11 of 2026-10-26) — see known_issues
    env_block: core + FOUNDRY_DECISIONS_NAME (optional, step 2b)
  - n: 2
    file: foundry-demo-2-hosted-agents.ipynb
    deck: "Microsoft Foundry Hosted Agents.pptx"
    env_block: core + HOSTED_AGENT_NAME, LONG_RUNNING_AGENT_NAME, APP_INSIGHTS_RESOURCE_ID (no gateway since 2026-10-11)
  - n: 3
    file: foundry-demo-3-hosted-agent-private-nework.ipynb   # (sic) — never rename
    deck: "Microsoft Foundry Hosted Agents.pptx"
    env_block: PRIVATE_DEMO_*
  - n: 4
    file: foundry-demo-4-promp-caching.ipynb                  # (sic) — never rename
    deck: "Microsoft Foundry Prompt Caching.pptx"
    env_block: core
  - n: 5
    file: foundry-demo-5-a2a.ipynb
    companions: [REST Client .http file]
    deck: "Microsoft Foundry Agent2Agent-A2A.pptx"
    env_block: core + FOUNDRY_A2A_*, FOUNDRY_AGENT_NAME
  - n: 6
    file: foundry-demo-6-content-understanding.ipynb
    deck: "Microsoft Foundry Content-Understanding.pptx"
    env_block: CONTENTUNDERSTANDING_*, CU_*
  - n: 7
    file: foundry-demo-7-voice-live.ipynb
    deck: "Microsoft Foundry Voice Live-Voice Agents.pptx"
    env_block: core + AZURE_VOICELIVE_ENDPOINT, VOICELIVE_*, VOICE_AGENT_MODEL
  - n: 8
    file: foundry-demo-8-ai-gateway-governance.ipynb
    deck: "Microsoft Foundry AI Gateway.pptx"
    env_block: AZURE_SUBSCRIPTION_ID + AI gateway block (APIM_*, INFERENCE_*, MCP_*, A2A_*, APPINSIGHTS_*, LOG_ANALYTICS_*)
  - n: 9
    file: foundry-demo-9-fabric-iq-and-foundry-iq-agents.ipynb
    deck: "Microsoft Foundry Fabric IQ and Foundry IQ Agents.pptx"   # in preparation; step headings name deck sections until slide numbers exist
    sample: games-operations
    env_block: core + FOUNDRY_EMBEDDING_NAME + AZURE_SEARCH_ENDPOINT, FABRIC_WORKSPACE_ID, FABRIC_LAKEHOUSE_ID, FABRIC_ONTOLOGY_ID, FABRIC_DOCS_FOLDER (optional); steps 5-6 add AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, FOUNDRY_PROJECT_NAME (optional), APP_INSIGHTS_RESOURCE_ID (optional), FOUNDRY_CONNECTIONS_API_VERSION (optional)
    hosted_agent: samples/games-operations/hosted-agent   # separate azd project; agent/azure.yaml unchanged
    status: steps 0-4 (knowledge layer, run by the owner 2026-11-10); steps 5-6 (agents, evaluations, tracing) added 2026-11-10, not yet run; steps 7-11 to follow

samples:
  - name: games-operations
    path: samples/games-operations
    generator_version: 1.0.0
    added: 2026-11-07
    default_theme: neutral        # wording only; the same data model in every theme ("ioc" kept as an option)
    defaults: {seed: 2026, start_date: 2026-11-16, as_of: "day 9, 11:00 UTC"}
    entry_points:
      - generator/generate.py               # tables, telemetry, PDFs, evaluation set, ontology spec
      - generator/stream_simulator.py       # live race, weather and gate flow to an Eventstream custom endpoint
      - fabric/01_load_lakehouse.ipynb      # Fabric notebook, not a kit demo notebook (kit_check reads root notebooks only)
      - fabric/02_eventhouse_setup.kql
      - fabric/03_build_semantic_model.ipynb  # semantic model (keys, relationships, measures, roles) and ontology check
      - fabric/04_extract_findings.ipynb      # AI functions extract inspection findings into the finding table
      - ontology/ontology-agent-prompts.md    # prompts that finish the ontology after "Generate ontology"; prompt 3 adds findings
    design: ontology/ontology-design.md     # generated by generator/render_design.py from generator/ontology_spec.py (also writes the prompts)
    used_by: [9]                            # and the end-to-end deck, once built
    note: >-
      Synthetic Games-time operations data for a Fabric IQ ontology with three source types (lakehouse,
      eventhouse, semantic model) plus PDF documents for AI functions extraction and Foundry IQ. Public
      committee codes and country names; venues, people, assets, thresholds and findings are fictional.
      Output is deterministic for the same seed and dates and is regenerated, not committed.

# Shared variables: a new notebook reuses one ONLY with the identical meaning;
# otherwise it adds a prefixed name (feature prefix or NB<n>_).
env:
  FOUNDRY_PROJECT_ENDPOINT: {meaning: "Foundry project endpoint https://<resource>.services.ai.azure.com/api/projects/<project>", notebooks: [1, 2, 4, 5, 7, 8, 9]}
  FOUNDRY_MODEL_NAME:       {meaning: "chat model deployment name (or the Model Router deployment)", notebooks: [1, 4, 5, 9]}
  FOUNDRY_ROUTER_NAME:      {meaning: "Model Router deployment name", notebooks: [1]}
  FOUNDRY_EMBEDDING_NAME:   {meaning: "embedding model deployment name", notebooks: [1, 9]}
  FOUNDRY_DECISIONS_NAME:   {meaning: "optional gpt-6-luna deployment name for the Decisions API step; blank skips the step", notebooks: [1]}
  FOUNDRY_PROJECT_NAME:     {meaning: "Foundry project name matching FOUNDRY_PROJECT_ENDPOINT; NB1 and NB9 derive it when blank or unset, NB7 requires it for Voice Live with an agent", notebooks: [1, 7, 9]}
  FOUNDRY_ACCOUNT_NAME:     {meaning: "optional NB1 override of the Foundry account name; blank or unset derives it from FOUNDRY_PROJECT_ENDPOINT", notebooks: [1]}
  AZURE_SUBSCRIPTION_ID:    {meaning: "shared subscription containing the kit's Foundry and API Management resources; PRIVATE_DEMO_SUBSCRIPTION_ID must use the same subscription", notebooks: [1, 8, 9]}
  AZURE_RESOURCE_GROUP:     {meaning: "Foundry resource group containing the account and project", notebooks: [1, 9]}
  APIM_RESOURCE_GROUP:      {meaning: "API Management resource group in the shared AZURE_SUBSCRIPTION_ID", notebooks: [8]}
  APIM_GATEWAY_URL:         {meaning: "API Management base URL https://<apim>.azure-api.net, without the API suffix (INFERENCE_API_PATH supplies it)", notebooks: [8]}
  AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING: {meaning: "opt-in for client-side generative AI tracing", notebooks: [1, 9]}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: {meaning: "record prompts and completions in traces (dev only, default false)", notebooks: [1, 9]}
  AZURE_SEARCH_ENDPOINT:    {meaning: "Azure AI Search service endpoint https://<service>.search.windows.net (Basic tier or higher)", notebooks: [9]}
  FABRIC_WORKSPACE_ID:      {meaning: "Fabric workspace ID holding the games-operations items", notebooks: [9]}
  FABRIC_LAKEHOUSE_ID:      {meaning: "Fabric lakehouse item ID (GamesLakehouse) whose Files area holds the sample PDFs", notebooks: [9]}
  FABRIC_ONTOLOGY_ID:       {meaning: "Fabric ontology item ID (GamesOperationsOntology)", notebooks: [9]}
  FABRIC_DOCS_FOLDER:       {meaning: "optional PDF folder under the lakehouse Files area; blank uses games_ops/output/documents", notebooks: [9]}
  APP_INSIGHTS_RESOURCE_ID: {meaning: "resource ID of the Application Insights component connected to the Foundry project", notebooks: [2, 9]}
  FOUNDRY_CONNECTIONS_API_VERSION: {meaning: "optional ARM API version for Foundry project connections created over REST; blank uses 2025-10-01-preview", notebooks: [9]}

known_issues:   # kit_check.py over all eight notebooks on 2026-10-11, adjusted for the owner's changes of 2026-10-11 (notebook 2 gateway removed, outputs cleared); re-run after every pull
  - "NB5 installs packages with %pip in two cells (azure-ai-projects>=2.5.0 vs root >=2.7.0,<3) — move to requirements.txt"
  - "azure-ai-projects used with preview surfaces (.beta., *PreviewTool) without a minor cap"
  - "azure-search-documents floors at 11.6.0 with no upper bound while 12.0.0 is out"
  - "README has no Notebook 4 section (notebook 4 appears only in the tables and the Repository Guide)"
  - "decks/CHANGELOG.md lists editions 2026-09 to 2026-10-22 whose files are no longer in decks/ (only edition 2026-10-26 is); history kept on purpose"
  - "NB1 slide references were written against what's-new edition 2026-10 (25 slides); references to slide 11 are one lower and to slides 12-25 two lower than in edition 2026-10-26 (slides 1-10 unchanged) — run deck-companion-notebook DECK REFRESH MODE"
  - "Microsoft Foundry Copilot Harness Prompt Agents.pptx carries a Microsoft sensitivity label with encryption applied in OneDrive; people outside the tenant cannot open it from GitHub until the owner sets the label in PowerPoint"
  - "What's-new edition 2026-10-26: second-person wording remains on slides 5, 8, 15, 17, 21, 23, 24 and 25, text at 6.5-7.0pt on slides 24 and 25, and the notes of slides 1 and 5 still use the retired label style"
  - "samples/games-operations: the Fabric notebooks and KQL script have not yet been run in a Fabric workspace; ontology generation is a portal action (no public API), so the ontology is finished with agent prompts and checked by notebook 03; export TMDL with getDefinition once built"
  - "samples/games-operations: evaluation questions say 'NOC' in both themes; the neutral theme labels the entity 'National Committee'"
  - "NB9 (2026-11-09): written against azure-search-documents 12.1.0b2 and REST API 2026-08-01-preview, not yet executed against Azure; Fabric MCP token scopes and Content Understanding with the OneLake indexer are open verify items"
  - "NB9 steps 5-6 (2026-11-10): not yet executed against Azure; azure-ai-projects raised to >=2.9.0,<2.11 for the Copilot harness (preview cap closes the azure-ai-projects known issue above); the hosted agent runs in process as the user and needs an OAuth toolbox connection or another production option before deployment (samples/games-operations/hosted-agent/README.md)"
  - "mcp capped below 2 on 2026-11-09: mcp 2.0 removed streamablehttp_client used by NB1, NB8 and NB9; environments that already installed mcp 2.x need 'pip install -r requirements.txt' again"
