# kit.yaml — manifest of the Microsoft Foundry What's New and Deep-Dive Kit.
# Read on every run by the four kit skills (azure-ai-deep-dive-deck, foundry-whats-new-deck,
# deck-companion-notebook, interactive-deck-story). The files in the repository win over this
# manifest: when they disagree, fix this file in the same pull request.
# Personal values (private package index, tenant, subscription, resource names) never go here:
# put them in .env (git-ignored) or kit.local.yaml (git-ignored).

kit:
  name: Microsoft Foundry What's New and Deep-Dive Kit
  manifest_version: 1
  skills_version: 1.4.0          # see skills/CHANGELOG.md
  updated: 2026-11-19
  python_kernel: "3.12"          # notebooks (devcontainer)
  hosted_agent_runtime: ["3.13"]   # agent/azure.yaml and private-agent/azure.yaml — separate from the kernel

paths:
  skills: skills/
  decks: decks/
  deck_changelog: decks/CHANGELOG.md            # owned by foundry-whats-new-deck
  deep_dive_register: decks/DEEP-DIVE-DECKS.md  # owned by azure-ai-deep-dive-deck
  interactive_stories: interactive-stories/     # owned by interactive-deck-story; story sources in src/<topic>/
  notebooks: ./                                 # foundry-demo-<n>-<topic>.ipynb at the root
  notebooks_changelog: NOTEBOOKS-CHANGELOG.md   # owned by deck-companion-notebook
  requirements: requirements.txt
  env_example: .env.example
  readme: README.md
  samples: samples/                             # shared synthetic datasets; generated output is never committed

naming:
  whats_new_deck: "Microsoft-Foundry-Whats-New-<yyyy>-<mm>[-<dd>].pptx"
  deep_dive_deck: "Microsoft Foundry <Subject>.pptx"   # Title Case subject, no "deep dive", no date; edition in decks[].edition
  notebook: "foundry-demo-<n>-<topic>.ipynb"
  interactive_story: "<deck base name> - Interactive.html"   # in interactive-stories/; sources in interactive-stories/src/<topic>/
  rule: >-
    New files use these patterns. A deep-dive deck keeps one file name across editions: a new
    edition replaces the file in a pull request and gets a new register entry (git history is
    the rollback). The what's-new deck gets a new dated file per edition, and decks/ keeps
    only the newest edition: older Microsoft-Foundry-Whats-New-*.pptx files are deleted in the
    same pull request once the new edition is in decks/ (git history and decks/CHANGELOG.md are
    the rollback). Never rename or renumber another contributor's file.

next_notebook_number: 12

decks:
  - file: Microsoft-Foundry-Whats-New-2026-11.pptx
    kind: whats-new
    edition: 2026-11
    slides: 27
    maintained_by: foundry-whats-new-deck
    pairs_with: [1]
    previous_edition: Microsoft-Foundry-Whats-New-2026-10-26.pptx   # edition 2026-10-26 (27 slides); delete from decks/ in the same pull request — the rollback is git history
    note: Ignite 2026 edition, same 27 slides with a changed structure — new 8 Training in Foundry, 13 Foundry IQ and Microsoft IQ (old 14 + 15), 15 Microsoft Copilot harness, 24 Continuous improvement loop, 25 Cost control and budgets; removed old 8 Deployment types, 9 Priority and Flex, 18 Teams publishing; mapping in decks/CHANGELOG.md
  - file: "Microsoft Foundry Guardrails - Tuning Without Over-Blocking.pptx"
    kind: deep-dive
    source_build: guardrails-tuning-deep-dive-2026-10 (refactored with azure-ai-deep-dive-deck; replaces the V4 build)
    slides: 14
    pairs_with: [1]
    note: guardrails section of notebook 1; test data from github.com/strudel0209/foundry-content-safety-eval
  - file: "Microsoft Foundry Hosted Agents.pptx"
    kind: deep-dive
    source_build: hosted-agents-deep-dive-2026-10 (second build)
    slides: 7
    pairs_with: [2, 3]
  - file: "Microsoft Foundry Prompt Caching.pptx"
    kind: deep-dive
    pairs_with: [4]
    note: not built with the kit skills
  - file: "Microsoft Foundry Agent2Agent-A2A.pptx"
    kind: deep-dive
    pairs_with: [5]
  - file: "Microsoft Foundry Content-Understanding.pptx"
    kind: deep-dive
    slides: 12
    pairs_with: [6]
  - file: "Microsoft Foundry Voice Live-Voice Agents.pptx"
    kind: deep-dive
    source_build: voice-live-voice-agents-deep-dive-2026-10 (second build)
    slides: 9
    pairs_with: [7]
  - file: "Microsoft Foundry AI Gateway.pptx"
    kind: deep-dive
    source_build: ai-gateway-deep-dive-2026-10 (second build)
    slides: 9
    pairs_with: [8]
  - file: "Microsoft Foundry Copilot Harness Prompt Agents.pptx"
    kind: deep-dive
    edition: 2026-10
    slides: 7
    pairs_with: [9]         # NB9 step 5 compares prompt, harness and hosted agents; no slide mapping
    note: Microsoft Copilot harness for prompt agents (preview); compares standard prompt agents, harness agents and hosted agents
  - file: "Microsoft Foundry Fabric IQ Ontologies for Agents.pptx"
    kind: deep-dive
    edition: 2026-11
    slides: 17
    pairs_with: []          # no companion notebook yet
    note: Fabric IQ ontologies with structured and unstructured data for Foundry, Copilot Studio and Microsoft 365 Copilot agents; customer-neutral kit copy (first built for a customer session); carries the Microsoft sensitivity label from OneDrive, no encryption
  - file: "Microsoft Foundry Latency Optimization for Models and Agents.pptx"
    kind: deep-dive
    edition: 2026-11
    slides: 18
    pairs_with: [10]        # related: NB1 priority processing, NB4 prompt caching, NB8 semantic caching
    note: latency best practices and decision trees (model, capacity, orchestration pattern, agent runtime and framework, tools and protocols) with the Foundry features that shorten response time; customer-neutral kit copy (built after a customer latency review); carries a Microsoft sensitivity label with encryption applied in OneDrive — see known_issues
  - file: "Microsoft Foundry Microsoft IQ.pptx"
    kind: deep-dive
    edition: 2026-11
    slides: 18
    pairs_with: [11]        # NB11 steps carry slides 5-9; related: NB9 (Foundry IQ knowledge base and Fabric IQ ontology), NB10 step 12 (knowledge base retrieval)
    note: Microsoft IQ as announced at Ignite 2026, with Foundry IQ in depth (Azure AI Search renamed, knowledge sources, agentic retrieval, Agent Service integration, permissions and network boundaries, November updates), then Work IQ, Fabric IQ and Web IQ (APIs, crawling and index engine, data security and Zero Query Logging), a comparison of the four and selection guidance; named with "Microsoft IQ" in full so it is not mistaken for a Foundry IQ deck; kit copy without a presenter line; carries a Microsoft sensitivity label with encryption applied in OneDrive — see known_issues

# Offline interactive HTML stories built from decks by interactive-deck-story (owned by that skill).
# Paths in an entry are relative to paths.interactive_stories; deck entries above are never changed for a story.
interactive_stories:
  - file: "Microsoft Foundry Latency Optimization for Models and Agents - Interactive.html"
    source: src/latency-optimization-for-models-and-agents/   # story.json and renderers.js (two topic renderers)
    deck: "Microsoft Foundry Latency Optimization for Models and Agents.pptx"
    deck_edition: 2026-11
    scenes: 18
    engine: 1.0.1
    built: 2026-11-16
    checks: "story_check pass; HTML validator 0 errors, 0 warnings; render_check pass (headless Chromium, every scene); full-screen fallback tested in Chromium (page, sandboxed frame, denied frame, refused request, prefixed API); not tested in Safari or Firefox"

notebooks:
  - n: 1
    file: foundry-demo-1-what-is-new.ipynb
    deck: Microsoft-Foundry-Whats-New-2026-11.pptx   # slide references refreshed to edition 2026-11 on 2026-11-18
    env_block: core + FOUNDRY_DECISIONS_NAME (optional, step 2b)
  - n: 2
    file: foundry-demo-2-hosted-agents.ipynb
    deck: "Microsoft Foundry Hosted Agents.pptx"
    env_block: core + HOSTED_AGENT_NAME, LONG_RUNNING_AGENT_NAME, APP_INSIGHTS_RESOURCE_ID (no gateway since 2026-10-11)
  - n: 3
    file: foundry-demo-3-hosted-agent-private-nework.ipynb   # (sic) — never rename
    deck: "Microsoft Foundry Hosted Agents.pptx"
    env_block: PRIVATE_DEMO_*
  - n: 4
    file: foundry-demo-4-promp-caching.ipynb                  # (sic) — never rename
    deck: "Microsoft Foundry Prompt Caching.pptx"
    env_block: core
  - n: 5
    file: foundry-demo-5-a2a.ipynb
    companions: [REST Client .http file]
    deck: "Microsoft Foundry Agent2Agent-A2A.pptx"
    env_block: core + FOUNDRY_A2A_*, FOUNDRY_AGENT_NAME
  - n: 6
    file: foundry-demo-6-content-understanding.ipynb
    deck: "Microsoft Foundry Content-Understanding.pptx"
    env_block: CONTENTUNDERSTANDING_*, CU_*
  - n: 7
    file: foundry-demo-7-voice-live.ipynb
    deck: "Microsoft Foundry Voice Live-Voice Agents.pptx"
    env_block: core + AZURE_VOICELIVE_ENDPOINT, VOICELIVE_*, VOICE_AGENT_MODEL
  - n: 8
    file: foundry-demo-8-ai-gateway-governance.ipynb
    deck: "Microsoft Foundry AI Gateway.pptx"
    env_block: AZURE_SUBSCRIPTION_ID + AI gateway block (APIM_*, INFERENCE_*, MCP_*, A2A_*, APPINSIGHTS_*, LOG_ANALYTICS_*)
  - n: 9
    file: foundry-demo-9-fabric-iq-and-foundry-iq-agents.ipynb
    deck: "Microsoft Foundry Fabric IQ and Foundry IQ Agents.pptx"   # in preparation; step headings name deck sections until slide numbers exist
    sample: games-operations
    env_block: core + FOUNDRY_EMBEDDING_NAME + AZURE_SEARCH_ENDPOINT, FABRIC_WORKSPACE_ID, FABRIC_LAKEHOUSE_ID, FABRIC_ONTOLOGY_ID, FABRIC_DOCS_FOLDER (optional); steps 5-6 add AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, FOUNDRY_PROJECT_NAME (optional), APP_INSIGHTS_RESOURCE_ID (optional), FOUNDRY_CONNECTIONS_API_VERSION (optional); step 7 adds FABRIC_RLS_TEST_USER
    hosted_agent: samples/games-operations/hosted-agent   # separate azd project; agent/azure.yaml unchanged
    status: steps 0-4 (knowledge layer, run by the owner 2026-11-10); steps 5-6 (agents, evaluations, tracing) run by the owner 2026-11-11; step 7 (permission test) run by the owner 2026-11-12; step 9 (publishing to Microsoft 365 Copilot and Teams, web app call, A2A) added 2026-11-12, not yet run; steps 8, 10 and 11 to follow
  - n: 10
    file: foundry-demo-10-latency-optimization-for-models-and-agents.ipynb
    deck: "Microsoft Foundry Latency Optimization for Models and Agents.pptx"   # edition 2026-11; step headings carry its slide numbers
    env_block: core + NB10_SMALL_MODEL_NAME (optional, step 3), NB10_KNOWLEDGE_BASE (optional, step 12); optional steps reuse FOUNDRY_DECISIONS_NAME (3), FOUNDRY_ROUTER_NAME (4), HOSTED_AGENT_NAME (11), AZURE_SEARCH_ENDPOINT (12)
    reuses: [2, 9]          # step 11 calls notebook 2's hosted agent; step 12 queries notebook 9's knowledge base
    status: written 2026-11-14 against agent-framework 1.25.0 and agent-framework-foundry 1.16.2; not yet run against Azure
  - n: 11
    file: foundry-demo-11-microsoft-iq.ipynb
    deck: "Microsoft Foundry Microsoft IQ.pptx"   # edition 2026-11; step headings carry its slide numbers (5-9)
    env_block: AZURE_SEARCH_ENDPOINT + AZURE_SUBSCRIPTION_ID + NB11_SEARCH_RESOURCE_GROUP; optional NB11_SEARCH_MGMT_API_VERSION, NB11_SERVERLESS_* (step 1), NB11_CU_* (step 6), NB11_GRAPH_* (step 10), FOUNDRY_PROJECT_ENDPOINT and FOUNDRY_MODEL_NAME (steps 6, 7, 9c)
    status: written 2026-11-19 against azure-search-documents 12.2.0b1, Search Management REST 2026-11-01 and Search Service REST 2026-10-01 / 2026-11-01-preview; not yet run against Azure

samples:
  - name: games-operations
    path: samples/games-operations
    generator_version: 1.0.0
    added: 2026-11-07
    default_theme: neutral        # wording only; the same data model in every theme ("ioc" kept as an option)
    defaults: {seed: 2026, start_date: 2026-11-16, as_of: "day 9, 11:00 UTC"}
    entry_points:
      - generator/generate.py               # tables, telemetry, PDFs, evaluation set, ontology spec
      - generator/stream_simulator.py       # live race, weather and gate flow to an Eventstream custom endpoint
      - fabric/01_load_lakehouse.ipynb      # Fabric notebook, not a kit demo notebook (kit_check reads root notebooks only)
      - fabric/02_eventhouse_setup.kql
      - fabric/03_build_semantic_model.ipynb  # semantic model (keys, relationships, measures, roles) and ontology check
      - fabric/04_extract_findings.ipynb      # AI functions extract inspection findings into the finding table
      - ontology/ontology-agent-prompts.md    # prompts that finish the ontology after "Generate ontology"; prompt 3 adds findings
    design: ontology/ontology-design.md     # generated by generator/render_design.py from generator/ontology_spec.py (also writes the prompts)
    used_by: [9]                            # and the end-to-end deck, once built
    note: >-
      Synthetic Games-time operations data for a Fabric IQ ontology with three source types (lakehouse,
      eventhouse, semantic model) plus PDF documents for AI functions extraction and Foundry IQ. Public
      committee codes and country names; venues, people, assets, thresholds and findings are fictional.
      Output is deterministic for the same seed and dates and is regenerated, not committed.

# Shared variables: a new notebook reuses one ONLY with the identical meaning;
# otherwise it adds a prefixed name (feature prefix or NB<n>_).
env:
  FOUNDRY_PROJECT_ENDPOINT: {meaning: "Foundry project endpoint https://<resource>.services.ai.azure.com/api/projects/<project>", notebooks: [1, 2, 4, 5, 7, 8, 9, 10, 11]}
  FOUNDRY_MODEL_NAME:       {meaning: "chat model deployment name (or the Model Router deployment)", notebooks: [1, 4, 5, 9, 10, 11]}
  FOUNDRY_ROUTER_NAME:      {meaning: "Model Router deployment name", notebooks: [1, 10]}
  FOUNDRY_EMBEDDING_NAME:   {meaning: "embedding model deployment name", notebooks: [1, 9]}
  FOUNDRY_DECISIONS_NAME:   {meaning: "optional gpt-6-luna deployment name for the Decisions API step; blank skips the step", notebooks: [1, 10]}
  FOUNDRY_PROJECT_NAME:     {meaning: "Foundry project name matching FOUNDRY_PROJECT_ENDPOINT; NB1 and NB9 derive it when blank or unset, NB7 requires it for Voice Live with an agent", notebooks: [1, 7, 9]}
  FOUNDRY_ACCOUNT_NAME:     {meaning: "optional NB1 override of the Foundry account name; blank or unset derives it from FOUNDRY_PROJECT_ENDPOINT", notebooks: [1, 10]}
  AZURE_SUBSCRIPTION_ID:    {meaning: "shared subscription containing the kit's Foundry and API Management resources; PRIVATE_DEMO_SUBSCRIPTION_ID must use the same subscription", notebooks: [1, 8, 9, 11]}
  AZURE_RESOURCE_GROUP:     {meaning: "Foundry resource group containing the account and project", notebooks: [1, 9]}
  APIM_RESOURCE_GROUP:      {meaning: "API Management resource group in the shared AZURE_SUBSCRIPTION_ID", notebooks: [8]}
  APIM_GATEWAY_URL:         {meaning: "API Management base URL https://<apim>.azure-api.net, without the API suffix (INFERENCE_API_PATH supplies it)", notebooks: [8]}
  AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING: {meaning: "opt-in for client-side generative AI tracing", notebooks: [1, 9]}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: {meaning: "record prompts and completions in traces (dev only, default false)", notebooks: [1, 9]}
  AZURE_SEARCH_ENDPOINT:    {meaning: "Azure AI Search service endpoint https://<service>.search.windows.net (Basic tier or higher)", notebooks: [9, 10, 11]}
  FABRIC_WORKSPACE_ID:      {meaning: "Fabric workspace ID holding the games-operations items", notebooks: [9]}
  FABRIC_LAKEHOUSE_ID:      {meaning: "Fabric lakehouse item ID (GamesLakehouse) whose Files area holds the sample PDFs", notebooks: [9]}
  FABRIC_ONTOLOGY_ID:       {meaning: "Fabric ontology item ID (GamesOperationsOntology)", notebooks: [9]}
  FABRIC_DOCS_FOLDER:       {meaning: "optional PDF folder under the lakehouse Files area; blank uses games_ops/output/documents", notebooks: [9]}
  APP_INSIGHTS_RESOURCE_ID: {meaning: "resource ID of the Application Insights component connected to the Foundry project", notebooks: [2, 9]}
  FOUNDRY_CONNECTIONS_API_VERSION: {meaning: "optional ARM API version for Foundry project connections created over REST; blank uses 2025-10-01-preview", notebooks: [9]}
  FABRIC_RLS_TEST_USER:     {meaning: "sign-in name of the Norway-only test user for the permission test (workspace Viewer, member of the semantic model role)", notebooks: [9]}
  NB10_SMALL_MODEL_NAME:    {meaning: "optional small model deployment for notebook 10's classification comparison, e.g. gpt-5.4-mini; blank skips that row", notebooks: [10]}
  NB10_KNOWLEDGE_BASE:      {meaning: "optional knowledge base on AZURE_SEARCH_ENDPOINT with a model configuration; blank uses notebook 9's games-kb", notebooks: [10]}
  NB11_SEARCH_RESOURCE_GROUP: {meaning: "resource group of the search service in AZURE_SEARCH_ENDPOINT, in AZURE_SUBSCRIPTION_ID; blank skips step 1", notebooks: [11]}
  NB11_SEARCH_MGMT_API_VERSION: {meaning: "optional Search Management REST API version for step 1; blank uses 2026-11-01", notebooks: [11]}
  NB11_SERVERLESS_SERVICE_NAME: {meaning: "optional name of a new Serverless search service created in step 1 (chargeable); blank skips", notebooks: [11]}
  NB11_SERVERLESS_LOCATION: {meaning: "optional region of the step 1 Serverless service; blank uses the existing service's region", notebooks: [11]}
  NB11_CU_STORAGE_RESOURCE_ID: {meaning: "optional storage account resource ID for step 6 (Content Understanding semantic chunking); blank skips step 6", notebooks: [11]}
  NB11_CU_CONTAINER:        {meaning: "optional blob container with a few PDF files for step 6", notebooks: [11]}
  NB11_GRAPH_KNOWLEDGE_BASE: {meaning: "optional knowledge base with an entity or topic graph on AZURE_SEARCH_ENDPOINT for step 10; blank skips", notebooks: [11]}
  NB11_GRAPH_KNOWLEDGE_SOURCE: {meaning: "optional graph knowledge source of NB11_GRAPH_KNOWLEDGE_BASE", notebooks: [11]}

